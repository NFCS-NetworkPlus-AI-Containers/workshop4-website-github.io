name: Render webpage

on:
  push:
    branches: NFCS-workshop4
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: 'render-website_${{ github.ref }}'
  cancel-in-progress: true

jobs:

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render HTML
        run: make html

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write  # We trust the deploy action with write permissions
      id-token: write  # We trust the deploy action with write permissions
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render HTML
        run: make html

      - name: Deploy Documentation for main
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: gh-pages    # The branch the action should deploy to.
          folder: build/html  # The folder the action should deploy.
